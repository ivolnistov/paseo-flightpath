<div id="exm-root" aria-label="Макет: выполнение этапа фичи">
<style>
#exm-root{color-scheme:light dark;container-type:inline-size;width:100%;
  --bg:light-dark(#f5f5f3,#131313);--sf:light-dark(#fff,#1a1a1a);--sf2:light-dark(#f7f7f5,#1f1f1f);--hv:light-dark(#efefec,#262626);
  --ln:light-dark(#e3e3df,#2c2c2c);--ln2:light-dark(#cfcfca,#3b3b3b);--tx:light-dark(#1b1b1a,#ececea);--mu:light-dark(#62625c,#a2a29c);--fa:light-dark(#8a8a83,#7a7a75);
  --ac:light-dark(#2f5fd0,#89aaff);--acs:light-dark(#eef2fc,#1b2233);--am:light-dark(#9a5a00,#e2ae5c);--ams:light-dark(#fdf5e7,#2c2414);--gr:light-dark(#2a7443,#83d09d);
  --add:light-dark(#216b38,#8bd8a5);--addb:light-dark(#e7f5eb,#13271a);--del:light-dark(#b0261d,#ff9d94);--delb:light-dark(#fcebea,#311717);
  --inv:light-dark(#1d1d1c,#ececea);--invf:light-dark(#fff,#151515);
  --desk-h:660px;--phone-h:640px;
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
#exm-root *,#exm-root *::before,#exm-root *::after{box-sizing:border-box}
:where(#exm-root) :where(h2,h3,p,ul,ol,pre,fieldset){margin:0}
:where(#exm-root) :where(h2,h3){font-weight:500;font-size:14px}
:where(#exm-root) :where(button,textarea){font:inherit;color:inherit}
#exm-root svg{flex:none}
.exm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.exm-pv,.exm-util{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.exm-pv{margin-bottom:10px}
.exm-pv button,.exm-util button{border:1px solid var(--ln2);background:var(--sf);border-radius:8px;padding:4px 10px;min-height:32px}
.exm-pv button[aria-pressed="true"],.exm-util button[aria-pressed="true"]{background:var(--inv);color:var(--invf);border-color:var(--inv)}
.exm-util{margin-top:10px;display:block}
.exm-util summary{min-height:32px;display:flex;align-items:center}
.exm-util div{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.exm-stage{container-type:inline-size;margin:0 auto}
.exm-stage[data-layout="phone"]{max-width:393px}
.exm-app{display:flex;flex-direction:column;height:var(--desk-h);background:var(--bg);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
#exm-root[data-top] .exm-app{height:min(var(--desk-h),100dvh)}
.exm-top{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
.exm-tt{display:grid;min-width:0;flex:1;line-height:1.3}
.exm-tt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exm-tt>span{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exm-segs{display:flex;gap:3px}
.exm-segs i{width:22px;height:5px;border-radius:3px;background:var(--hv)}
.exm-segs .is-built{background:var(--gr)}.exm-segs .is-working{background:var(--ac)}.exm-segs .is-needs,.exm-segs .is-review{background:var(--am)}.exm-segs .is-stopped{background:var(--fa)}
.exm-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:var(--hv);color:var(--mu);font-size:12px;white-space:nowrap}
.exm-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fa)}
.exm-chip.is-working::before{background:var(--ac)}.exm-chip.is-needs::before,.exm-chip.is-review::before{background:var(--am)}.exm-chip.is-built::before{background:var(--gr)}
.exm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:5px 11px;border-radius:8px;border:1px solid var(--ln2);background:var(--sf);white-space:nowrap}
.exm-btn:hover:not(:disabled){background:var(--hv)}
.exm-btn:disabled{opacity:.45;cursor:not-allowed}
.exm-btn.is-pri{background:var(--inv);color:var(--invf);border-color:var(--inv)}
.exm-ibtn{width:40px;min-height:40px;padding:0}
.exm-link{background:none;border:0;padding:0 2px;color:var(--ac);min-height:28px}
.exm-mob{display:none}
.exm-body{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr)}
.exm-stages{min-height:0;overflow-y:auto;padding:12px 10px;border-right:1px solid var(--ln);background:var(--sf2)}
.exm-stages h2{font-size:12px;color:var(--mu);padding:0 6px 8px}
.exm-stages ol{list-style:none;padding:0;display:grid;gap:2px}
.exm-st{display:flex;gap:10px;width:100%;text-align:left;padding:9px 8px;border:0;border-radius:9px;background:transparent;min-height:44px}
.exm-st:hover{background:var(--hv)}
.exm-st[aria-current="true"]{background:var(--sf);box-shadow:inset 2px 0 0 var(--ac),0 0 0 1px var(--ln)}
.exm-st>span:last-child{display:grid;min-width:0}
.exm-st small{font-size:12px;color:var(--mu)}
.exm-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1.5px solid var(--ln2);color:var(--mu)}
.exm-n.is-built{background:var(--gr);border-color:var(--gr);color:var(--invf)}
.exm-n.is-working,.exm-n.is-stopped{border-color:var(--ac);color:var(--ac)}.exm-n.is-needs,.exm-n.is-review{border-color:var(--am);color:var(--am)}
.exm-plan-note{margin:12px 6px 0;font-size:12px;color:var(--mu)}
.exm-main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.exm-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px}
.exm-col{max-width:700px;margin:0 auto;display:grid;gap:12px}
.exm-agent{display:grid;gap:4px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln)}
.exm-agent .exm-col{gap:4px}
.exm-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exm-av{width:24px;height:24px;border-radius:7px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:12px}
.exm-act{font-size:13px;color:var(--mu)}
.exm-steps summary{font-size:12px;color:var(--mu);min-height:28px;display:flex;align-items:center}
.exm-steps ul{list-style:none;padding:2px 0 4px;display:grid;gap:2px;font-size:13px}
.exm-msg{padding:10px 12px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);white-space:pre-line}
.exm-msg.is-me{background:var(--acs);border-color:transparent;justify-self:end;max-width:85%}
.exm-meta{display:block;font-size:12px;color:var(--fa);margin-bottom:2px;white-space:normal}
.exm-sys{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.exm-tool{border:1px solid var(--ln);border-radius:10px;background:var(--sf2);font-size:13px}
.exm-tool summary{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:40px}
.exm-tool summary span:last-child{margin-left:auto;color:var(--mu);font-size:12px;white-space:nowrap}
.exm-tool pre,.exm-diff{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.exm-tool pre{padding:0 10px 10px;color:var(--mu)}
.exm-run{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);padding:4px 2px}
.exm-run i.dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.exm-run.is-off i.dot{background:var(--fa)}
.exm-card{padding:14px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);display:grid;gap:10px}
.exm-card.is-q{border-color:var(--am)}
.exm-card ul{list-style:none;padding:0;display:grid;gap:8px}
.exm-card li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.exm-card li>span:first-child{min-width:130px;color:var(--mu);font-size:13px}
.exm-ok{color:var(--gr)}.exm-wait{color:var(--am)}
.exm-note{font-size:12px;color:var(--mu)}
.exm-ch{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;min-height:44px}
.exm-ch:has(input:checked){border-color:var(--ac);background:var(--acs)}
.exm-ch input{margin:3px 0 0;accent-color:var(--ac)}
.exm-ch small{display:block;color:var(--mu);font-size:12px}
.exm-q-list{display:grid;gap:8px;border:0;padding:0}
.exm-composer{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--ln)}
.exm-composer .exm-col{gap:6px}
.exm-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--ams);color:var(--am);font-size:13px}
.exm-banner>span{flex:1 1 120px;min-width:0}
.exm-banner .exm-btn{margin-left:auto;flex:none}
.exm-crow{display:flex;gap:8px;align-items:flex-end;min-width:0}
.exm-crow>button{flex:none}
.exm-crow textarea{flex:1;min-width:0;min-height:40px;max-height:120px;resize:none;padding:8px 10px;border-radius:10px;border:1px solid var(--ln2);background:var(--sf2);font-size:16px}
.exm-hint{font-size:12px;color:var(--fa)}
.exm-sub{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
.exm-sub h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exm-file{border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf)}
.exm-file h3{padding:8px 12px;font:12.5px ui-monospace,Menlo,monospace;border-bottom:1px solid var(--ln);overflow-wrap:anywhere}
.exm-dl{display:grid;grid-template-columns:22px minmax(0,1fr)}
.exm-dl b{font-weight:400;text-align:center;color:var(--fa)}
.exm-dl.a{background:var(--addb);color:var(--add)}.exm-dl.d{background:var(--delb);color:var(--del)}
.exm-dl.a b{color:var(--add)}.exm-dl.d b{color:var(--del)}
.exm-doc ol{padding-left:20px;display:grid;gap:4px}
.exm-doc h3{margin-top:12px;color:var(--mu);font-size:13px}
@media (pointer:coarse){.exm-btn,.exm-link,.exm-pv button,.exm-util button,.exm-util summary{min-height:44px}.exm-ibtn{width:44px}}
@container (max-width:600px){
  .exm-pv{display:none}
  .exm-app{height:var(--phone-h);border-radius:18px}
  #exm-root[data-top] .exm-app{height:min(var(--phone-h),100dvh)}
  .exm-top{min-height:52px;padding:4px 6px;gap:6px}
  .exm-desk{display:none}
  .exm-mob{display:inline-flex}
  .exm-btn,.exm-link,.exm-tool summary,.exm-steps summary{min-height:44px}
  .exm-btn{min-width:44px}
  .exm-ibtn,.exm-resume{width:44px;padding:0}
  .exm-crow textarea{min-height:44px}
  .exm-body{grid-template-columns:minmax(0,1fr)}
  .exm-stages{display:none;border-right:0;background:var(--bg)}
  .exm-body.is-stages .exm-stages{display:block}
  .exm-body.is-stages .exm-main{display:none}
  .exm-scroll{padding:12px}
  .exm-agent{padding:8px 12px}
  .exm-card li>span:first-child{min-width:0;flex-basis:100%}
}
</style>

<div class="exm-pv" role="group" aria-label="Формат превью"><span>Превью:</span>
  <button type="button" class="cursor-interaction" data-layout="wide" aria-pressed="true">Широкий экран</button>
  <button type="button" class="cursor-interaction" data-layout="phone" aria-pressed="false">Телефон</button>
</div>
<div class="exm-stage" data-layout="wide"><div class="exm-app" data-region="app"></div></div>
<details class="exm-util"><summary class="cursor-interaction">Сценарии макета</summary>
  <div role="group" aria-label="Сценарий">
    <button type="button" class="cursor-interaction" data-scn="working" aria-pressed="true">Агент работает</button>
    <button type="button" class="cursor-interaction" data-scn="needs" aria-pressed="false">Нужен ответ</button>
    <button type="button" class="cursor-interaction" data-scn="result" aria-pressed="false">Результат этапа</button>
  </div>
</details>
<div class="exm-sr" aria-live="polite" data-region="live"></div>

<script>
(() => {
  const root = document.getElementById('exm-root');
  if (!root) return;
  const stageEl = root.querySelector('.exm-stage');
  const app = root.querySelector('[data-region="app"]');
  const live = root.querySelector('[data-region="live"]');
  try { if (window.top === window.self) root.dataset.top = '1'; } catch (err) { /* sandboxed frame */ }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ic = (n) => `<i data-lucide="${n}" aria-hidden="true"></i>`;
  const B = 'exm-btn cursor-interaction';

  const STAGES = [
    { n: 1, t: 'Локальное хранилище' }, { n: 2, t: 'Синхронизация' },
    { n: 3, t: 'Разрешение конфликтов' }, { n: 4, t: 'Объём хранения' }
  ];
  const LABEL = { built: 'Сделан', working: 'Выполняется', stopped: 'Остановлен', needs: 'Нужен ответ', review: 'Ждёт проверок', todo: 'Не начат' };
  const DIFF = [
    { f: 'src/sync/sendQueue.ts', l: [
      ' import { openStore } from "../store/localStore";',
      '+import { onOnline } from "../net/status";',
      ' ',
      ' export async function flushQueue(api: Api) {',
      '-  const items = await openStore().queue.all();',
      '-  for (const item of items) await api.push(item);',
      '+  const store = await openStore();',
      '+  const items = await store.queue.readBatch(50);',
      '+  for (const item of items) {',
      '+    const res = await api.push(item);',
      '+    if (res.ok) await store.queue.remove(item.id);',
      '+    else if (res.status === 409) await store.queue.markConflict(item.id);',
      '+  }',
      ' }',
      '+',
      '+onOnline(() => flushQueue(defaultApi));'] },
    { f: 'src/sync/sendQueue.test.ts', l: [
      ' describe("flushQueue", () => {',
      '+  it("удаляет из очереди подтверждённые правки", async () => {',
      '+    await flushQueue(fakeApi({ ok: true }));',
      '+    expect(await store.queue.size()).toBe(0);',
      '+  });',
      '+  it("помечает конфликт при ответе 409", async () => {',
      '+    await flushQueue(fakeApi({ status: 409 }));',
      '+    expect(await store.queue.conflicts()).toHaveLength(1);',
      '+  });',
      ' });'] }
  ];
  const fileStat = (i) => `+${DIFF[i].l.filter((x) => x[0] === '+').length} −${DIFF[i].l.filter((x) => x[0] === '-').length}`;
  const ADD = DIFF.reduce((n, d) => n + d.l.filter((x) => x[0] === '+').length, 0);
  const DEL = DIFF.reduce((n, d) => n + d.l.filter((x) => x[0] === '-').length, 0);
  const CHOICES = [
    ['keep', 'Оставить правку в очереди с пометкой «конфликт»', 'Ничего не теряется; разбор — в этапе 3 по решению 2.1.', 'правка остаётся в очереди с пометкой «конфликт», разбор — этап 3'],
    ['drop', 'Отбросить правку', 'Очередь чистая, но правка с выезда пропадёт.', 'правка удаляется из очереди'],
    ['restore', 'Восстановить заметку на сервере', 'Противоречит удалению в офисе без согласования.', 'заметка будет восстановлена на сервере с правкой из очереди']
  ];

  const S = { layout: 'wide', scn: 'working', view: 'chat', stage: 2, stopped: false, qOpen: false, pick: null, answered: false, draft: '', echo: [], open: {}, toBottom: true };

  const cur = () => S.scn === 'result' ? 'review' : (S.scn === 'needs' && !S.answered ? 'needs' : (S.stopped ? 'stopped' : 'working'));
  const status = (n) => n === 1 ? 'built' : (n === 2 ? cur() : 'todo');

  function tool(key, icon, title, right, body) {
    return `<details class="exm-tool" data-key="${key}" ${S.open[key] ? 'open' : ''}><summary class="cursor-interaction">${ic(icon)}<span>${esc(title)}</span><span>${esc(right)}</span></summary><pre>${esc(body)}</pre></details>`;
  }
  const msg = (who, time, text, me) => `<div class="exm-msg${me ? ' is-me' : ''}"><span class="exm-meta">${who} · ${time}</span>${esc(text)}</div>`;

  function header() {
    const st = STAGES[S.stage - 1];
    const s = status(S.stage);
    const onCur = S.stage === 2;
    return `<header class="exm-top">
      <button type="button" class="${B} exm-mob" data-act="stages" data-k="m-stages" aria-pressed="${S.view === 'stages'}">${ic('list')}Этапы</button>
      <div class="exm-tt"><b><span class="exm-desk">Офлайн-режим мобильного клиента</span><span class="exm-mob">Офлайн-режим</span></b><span>Этап ${st.n} из 4 · ${st.t}</span></div>
      <span class="exm-segs exm-desk" aria-label="Прогресс этапов">${STAGES.map((x) => `<i class="is-${status(x.n)}"></i>`).join('')}</span>
      <span class="exm-chip exm-desk is-${s}">${LABEL[s]}</span>
      <button type="button" class="${B} exm-desk" data-act="plan" data-k="h-plan" ${onCur ? '' : 'disabled'}>${ic('file-text')}План</button>
      <button type="button" class="${B}" data-act="diff" data-k="h-diff" ${onCur ? '' : 'disabled'} aria-label="Изменения этапа 2">${ic('git-compare')}<span class="exm-desk">Изменения</span></button>
    </header>`;
  }

  function stagesList() {
    return `<nav class="exm-stages" aria-label="Этапы фичи"><h2>Этапы фичи</h2><ol>${STAGES.map((x) => {
      const s = status(x.n);
      return `<li><button type="button" class="exm-st cursor-interaction" data-act="pick-stage" data-n="${x.n}" data-k="st-${x.n}" ${S.stage === x.n ? 'aria-current="true"' : ''}><span class="exm-n is-${s}">${s === 'built' ? '✓' : x.n}</span><span><span>${x.t}</span><small>${LABEL[s]}</small></span></button></li>`;
    }).join('')}</ol><p class="exm-plan-note">План фичи: ревизия 2 утверждена.</p></nav>`;
  }

  function agentStrip() {
    const c = cur();
    const act = { working: 'Работает: отправка очереди при появлении сети', stopped: 'Остановлен вами. Уже внесённые изменения сохранены', needs: 'Пауза: нужен ответ о конфликте при отправке', review: 'Закончил работу. Этап ждёт обязательных проверок' }[c];
    const done = c === 'review';
    const steps = [['Чтение очереди пачками', 1], ['Тесты хранилища очереди', 1], ['Отправка при появлении сети', done ? 1 : 0.5], ['Повтор с паузой при ошибке', done ? 1 : 0]];
    const n = steps.filter((x) => x[1] === 1).length;
    return `<div class="exm-agent"><div class="exm-col">
      <div class="exm-who"><span class="exm-av" aria-hidden="true">O</span><b style="font-weight:500">Opus · исполнитель</b><span class="exm-chip is-${c}">${LABEL[c]}</span></div>
      <p class="exm-act">${act}</p>
      <details class="exm-steps" data-key="steps" ${S.open.steps ? 'open' : ''}><summary class="cursor-interaction">Шаги плана: ${n} из ${steps.length}</summary>
        <ul>${steps.map(([t, v]) => `<li>${v === 1 ? '✓' : (v ? '●' : '○')} ${t}</li>`).join('')}</ul></details>
    </div></div>`;
  }

  function transcript() {
    const c = cur();
    const out = [
      `<div class="exm-sys">${ic('file-check')}План этапа 2 · ревизия 2 утверждена<button type="button" class="exm-link cursor-interaction" data-act="plan" data-k="t-plan">Открыть план</button></div>`,
      msg('Opus', '14:02', 'Начинаю этап 2. Сначала читаю очередь пачками, затем отправка при появлении сети, затем повтор с паузой при ошибке.'),
      tool('t1', 'file-pen', 'Изменён src/sync/sendQueue.ts', fileStat(0), 'readBatch(50) вместо all(); подтверждённые правки удаляются из очереди.'),
      tool('t2', 'flask-conical', 'npm test -- store/queue', '12 из 12', 'PASS store/queue.test.ts\n  ✓ читает пачку из 50 записей\n  ✓ сохраняет порядок правок\nTests: 12 passed'),
      msg('Opus', '14:09', '✓ Очередь читается пачками, тесты хранилища зелёные.\n● Сейчас: отправка при появлении сети.')
    ];
    if (S.scn === 'working' || (S.scn === 'needs' && S.answered)) {
      if (S.answered) out.push(msg('Вы', '14:15', 'Ответ: ' + CHOICES.find((x) => x[0] === S.pick)[1] + '\n(демо · агенту не отправлено)', true),
        msg('Opus', '14:15', 'Ответ принят (демо): ' + CHOICES.find((x) => x[0] === S.pick)[3] + '. Продолжаю с выбранным вариантом.'));
      out.push(`<div class="exm-run${S.stopped ? ' is-off' : ''}" role="status"><i class="dot" aria-hidden="true"></i>${S.stopped ? 'Прервано: npm test -- sync/send' : 'Выполняется: npm test -- sync/send'}</div>`);
    }
    if (S.scn === 'needs' && !S.answered) {
      out.push(tool('t3', 'flask-conical', 'npm test -- sync/send', '1 падение', 'FAIL sendQueue.test.ts\n  ✕ сервер вернул 409: заметка удалена в офисе'));
      out.push(msg('Opus', '14:12', 'Тест нашёл случай: сервер отвечает 409 — заметку удалили в офисе, пока телефон был без сети. Решения 2.1 об этом нет, поэтому останавливаюсь.'));
      out.push(`<section class="exm-card is-q" id="exm-q" aria-labelledby="exm-qt"><h3 id="exm-qt">Что сделать с правкой из очереди, если заметку уже удалили на сервере?</h3>${S.qOpen
        ? `<fieldset class="exm-q-list"><legend class="exm-sr">Варианты ответа</legend>${CHOICES.map(([v, t, d], i) => `<label class="exm-ch cursor-interaction"><input type="radio" name="exm-q" value="${v}" data-k="q-${v}" ${S.pick === v ? 'checked' : ''}><span>${t}${i === 0 ? ' <small>Рекомендация агента. ' + d + '</small>' : '<small>' + d + '</small>'}</span></label>`).join('')}</fieldset>
           <div><button type="button" class="${B} is-pri" data-act="answer" data-k="q-send" ${S.pick ? '' : 'disabled'}>Ответить и продолжить</button></div><p class="exm-note">Демо: ответ меняет только состояние макета.</p>`
        : `<div><button type="button" class="${B}" data-act="showq" data-k="q-show">Показать варианты</button></div>`}</section>`);
    }
    if (S.scn === 'result') {
      out.push(tool('t4', 'flask-conical', 'npm test -- sync', '41 из 41', 'PASS sync/sendQueue.test.ts\nPASS sync/retry.test.ts\nTests: 41 passed'),
        msg('Opus', '14:40', 'Шаги плана выполнены: отправка при появлении сети и повтор с паузой. Проверки кода пройдены. Этап передаю на независимое ревью.'),
        `<section class="exm-card" aria-labelledby="exm-rt"><h3 id="exm-rt">Результат этапа 2 · ждёт проверок</h3><ul>
          <li><span>Изменения</span><span>${DIFF.length} файла, +${ADD} −${DEL}</span><button type="button" class="exm-link cursor-interaction" data-act="diff" data-k="r-diff">Открыть</button></li>
          <li><span>Проверка кода</span><span class="exm-ok">✓ пройдена: типы, линтер, 41 тест</span></li>
          <li><span>Независимое ревью</span><span class="exm-wait">● ожидает</span></li></ul>
          <p class="exm-note">Агент закончил, но этап не завершён: «Сделан» появится только после ревью.</p></section>`);
    }
    S.echo.forEach((t) => out.push(msg('Вы', 'сейчас', t + '\n(демо · агенту не отправлено)', true)));
    return out.join('');
  }

  function composer() {
    const c = cur();
    const banner = c === 'needs' ? `<div class="exm-banner" role="status">${ic('circle-help')}<span>Агент ждёт ответа</span><button type="button" class="${B}" data-act="showq" data-k="b-showq">Показать вопрос</button></div>` : '';
    const ctl = c === 'working' ? `<button type="button" class="${B} exm-ibtn" data-act="stop" data-k="stop" aria-label="Остановить агента">${ic('square')}</button>`
      : (c === 'stopped' ? `<button type="button" class="${B} exm-resume" data-act="resume" data-k="stop" aria-label="Продолжить (демо)">${ic('play')}<span class="exm-desk">Продолжить (демо)</span></button>` : '');
    return `<form class="exm-composer" data-region="composer"><div class="exm-col">${banner}
      <div class="exm-crow"><label class="exm-sr" for="exm-input">Сообщение агенту</label><textarea id="exm-input" rows="1" placeholder="Сообщение агенту…" data-k="input">${esc(S.draft)}</textarea>${ctl}
      <button type="submit" class="${B} is-pri exm-ibtn" data-k="send" aria-label="Отправить (демо)">${ic('arrow-up')}</button></div>
      <p class="exm-hint">${c === 'stopped' ? 'Агент остановлен: ▶ — продолжить (демо). ' : ''}Демо: сообщения остаются в макете и агенту не уходят.</p></div></form>`;
  }

  function otherStage() {
    const st = STAGES[S.stage - 1];
    const body = S.stage === 1
      ? `<h3>Этап 1 · ${st.t} — сделан</h3><ul><li><span>Проверка кода</span><span class="exm-ok">✓ пройдена</span></li><li><span>Независимое ревью</span><span class="exm-ok">✓ принято</span></li></ul><p class="exm-note">Переписка завершённого этапа в макете не показана.</p>`
      : `<h3>Этап ${st.n} · ${st.t} — не начат</h3><p class="exm-note">Зависит от этапа 2: запуск откроется, когда этап 2 пройдёт проверки и ревью.</p><div><button type="button" class="${B}" disabled>${ic('lock')}Запустить этап</button></div>`;
    return `<div class="exm-scroll"><div class="exm-col"><section class="exm-card">${body}</section><div><button type="button" class="${B}" data-act="pick-stage" data-n="2" data-k="to-cur">${ic('arrow-left')}К текущему этапу</button></div></div></div>`;
  }

  function sub(title, extra) {
    return `<div class="exm-sub"><button type="button" class="${B}" data-act="back" data-k="back">${ic('arrow-left')}К чату</button><h2>${title}</h2>${extra || ''}</div>`;
  }

  function main() {
    if (S.view === 'diff') {
      return sub('Изменения · этап 2', `<span class="exm-note">+${ADD} −${DEL}</span>`) + `<div class="exm-scroll"><div class="exm-col">${DIFF.map((d) =>
        `<section class="exm-file"><h3>${d.f}</h3><div class="exm-diff">${d.l.map((x) => {
          const t = x[0], cls = t === '+' ? ' a' : (t === '-' ? ' d' : '');
          return `<div class="exm-dl${cls}"><b aria-hidden="true">${t === '+' ? '+' : (t === '-' ? '−' : '')}</b><span>${t === '+' ? '<span class="exm-sr">Добавлено: </span>' : (t === '-' ? '<span class="exm-sr">Удалено: </span>' : '')}${esc(x.slice(1)) || ' '}</span></div>`;
        }).join('')}</div></section>`).join('')}</div></div>`;
    }
    if (S.view === 'plan') {
      return sub('План этапа 2 · ревизия 2', '<span class="exm-chip is-built">утверждена</span>') + `<div class="exm-scroll"><div class="exm-col exm-card exm-doc">
        <h3 style="margin-top:0">Цель</h3><p>Очередь изменений уходит на сервер при появлении сети; подтверждённое удаляется, отклонённое помечается.</p>
        <h3>Шаги</h3><ol><li>Читать очередь пачками по 50.</li><li>Отправлять при появлении сети.</li><li>Удалять подтверждённые записи.</li><li>Повторять с паузой при ошибке сети.</li></ol>
        <h3>Проверка</h3><ol><li>Тесты отправки, повтора и перехода офлайн → онлайн.</li></ol>
        <p class="exm-note">Только чтение. Повторное утверждение для обычных действий не требуется.</p></div></div>`;
    }
    if (S.stage !== 2) return otherStage();
    return agentStrip() + `<div class="exm-scroll" data-region="scroll"><div class="exm-col">${transcript()}</div></div>` + composer();
  }

  function render() {
    const ae = document.activeElement;
    const k = ae && root.contains(ae) ? ae.getAttribute('data-k') : null;
    const sc = app.querySelector('[data-region="scroll"]');
    const prevTop = sc ? sc.scrollTop : 0;
    app.innerHTML = header() + `<div class="exm-body${S.view === 'stages' ? ' is-stages' : ''}">${stagesList()}<section class="exm-main" aria-label="Выполнение">${main()}</section></div>`;
    stageEl.dataset.layout = S.layout;
    root.querySelectorAll('[data-layout]').forEach((b) => { if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.layout === S.layout)); });
    root.querySelectorAll('[data-scn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scn === S.scn)));
    if (globalThis.lucide && globalThis.lucide.createIcons) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    const nsc = app.querySelector('[data-region="scroll"]');
    if (nsc) nsc.scrollTop = S.toBottom ? nsc.scrollHeight : prevTop;
    S.toBottom = false;
    if (k) { const el = root.querySelector(`[data-k="${k}"]`); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  }
  const say = (m) => { live.textContent = ''; setTimeout(() => { live.textContent = m; }, 30); };

  root.addEventListener('click', (e) => {
    const el = e.target.closest('button');
    if (!el || !root.contains(el) || el.disabled) return;
    if (el.dataset.layout) { S.layout = el.dataset.layout; render(); return; }
    if (el.dataset.scn) {
      Object.assign(S, { scn: el.dataset.scn, view: 'chat', stage: 2, stopped: false, qOpen: false, pick: null, answered: false, echo: [], toBottom: true });
      render(); say('Сценарий макета переключён'); return;
    }
    switch (el.dataset.act) {
      case 'stages': S.view = S.view === 'stages' ? 'chat' : 'stages'; break;
      case 'pick-stage': S.stage = +el.dataset.n; S.view = 'chat'; S.toBottom = S.stage === 2; break;
      case 'diff': S.view = 'diff'; break;
      case 'plan': S.view = 'plan'; break;
      case 'back': S.view = 'chat'; S.toBottom = true; break;
      case 'stop': S.stopped = true; say('Агент остановлен (демо)'); break;
      case 'resume': S.stopped = false; say('Возобновлено (демо)'); break;
      case 'showq': S.qOpen = true; render(); { const q = document.getElementById('exm-q'); if (q && q.scrollIntoView) q.scrollIntoView({ block: 'nearest' }); } return;
      case 'answer': if (!S.pick) return; S.answered = true; S.toBottom = true; say('Ответ принят (демо)'); break;
      default: return;
    }
    render();
  });
  root.addEventListener('change', (e) => { if (e.target.name === 'exm-q') { S.pick = e.target.value; render(); } });
  root.addEventListener('input', (e) => { if (e.target.id === 'exm-input') S.draft = e.target.value; });
  root.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.key) S.open[d.dataset.key] = d.open; }, true);
  root.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = S.draft.trim();
    if (!t) return;
    S.echo.push(t); S.draft = ''; S.toBottom = true; render(); say('Сообщение добавлено локально (демо)');
  });

  try { const p = new URLSearchParams(location.search).get('layout'); if (p === 'phone' || p === 'desktop') S.layout = p === 'phone' ? 'phone' : 'wide'; } catch (err) { /* no query in srcdoc */ }
  render();
})();
</script>
</div>
