'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

const SECTIONS = {planning: 'Planning', execution: 'Execution'};
const sectionFromHash = () => location.hash === '#execution' ? 'execution' : 'planning';
const compact = window.innerWidth < 700;

const state = {
  page: sectionFromHash(),
  planningView: compact ? 'cards' : 'diagram',
  executionView: compact ? 'cards' : 'diagram',
  branchRoot: 'all',
  taskConfig: {},
  taskEdits: {},
  deletedTasks: [],
  taskEditor: null,
  taskPrompt: null,
  flowRequests: [],
  flowChat: false,
  taskRequests: [],
  runState: {},
  mockChat: null,
};

const layers = [
  ['Start'],
  ['Gather requirements', 'Map user scenarios', 'Define acceptance', 'Document behavior'],
  ['Review existing search', 'Review access rules', 'Review accessibility', 'Review search ranking', 'Create fixtures', 'Confirm constraints'],
  ['Design search input', 'Design results list', 'Prepare empty states', 'Build search API', 'Connect results'],
  ['Build search UI', 'Test API', 'Run acceptance checks', 'Integrate changes'],
  ['Finalize delivery'],
];
const nodes = [];
layers.forEach((layer, c) => layer.forEach((name, r) => nodes.push({name, col: c, row: r, x: 40 + c * 300, y: layer.length === 1 ? 850 : 50 + r * 360})));
const find = (c, r) => nodes.find(n => n.col === c && n.row === r);
const edges = [];
for (let r = 0; r < 4; r++) edges.push([find(0, 0), find(1, r)]);
for (let c = 1; c < 4; c++) for (let r = 0; r < layers[c + 1].length; r++) edges.push([find(c, Math.min(r, layers[c].length - 1)), find(c + 1, r)]);
edges.push([find(2, 5), find(3, 4)], [find(3, 4), find(4, 3)]);
for (let r = 0; r < 4; r++) edges.push([find(4, r), find(5, 0)]);

const palette = {Start: ['#202829', '#52615d'], Research: ['#202c31', '#496a78'], Design: ['#2b2534', '#715d83'], Coding: ['#202d2b', '#4e7566'], Testing: ['#292b22', '#777a4e'], Review: ['#302a22', '#897353'], Acceptance: ['#30252a', '#8b626e']};
const initials = {Start: 'S', Research: 'R', Design: 'D', Coding: 'C', Testing: 'T', Review: 'V', Acceptance: 'A'};
const attentionStatuses = ['Needs review', 'Failed', 'Stopped'];

const stepTitle = name => state.taskEdits[name]?.title ?? name;
const stepDescription = name => state.taskEdits[name]?.description ?? (name === 'Start' ? 'Begin this workflow.' : `Work on ${name.toLowerCase()} for this feature.`);
const stepDod = name => state.taskEdits[name]?.dod ?? `${name} is complete, relevant checks pass, and the evidence is available for review.`;
const stepConfig = name => state.taskConfig[name] || {};

function stepKind(name) {
  if (name === 'Start') return 'Start';
  if (/test|fixtures/i.test(name)) return 'Testing';
  if (/acceptance|finalize/i.test(name)) return 'Acceptance';
  if (/review|confirm/i.test(name)) return 'Review';
  if (/build|connect|integrate/i.test(name)) return 'Coding';
  if (/design|empty states/i.test(name)) return 'Design';
  return 'Research';
}

function sampleStatus(n) {
  if (n.name === 'Start') return 'Done';
  if (n.name === 'Review accessibility') return 'Failed';
  if (n.col === 1) return n.row === 0 ? 'In progress' : n.row === 1 ? 'Needs review' : 'Waiting';
  return 'Waiting';
}

function statusColor(status) {
  if (status === 'Done' || status === 'Accepted') return '#42c977';
  if (status === 'In progress') return '#74b8f0';
  if (status === 'Needs review') return '#e4b65e';
  if (status === 'Failed') return '#ef7979';
  return '#87938f';
}

const trashIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';

function configSummary(name) {
  const cfg = stepConfig(name);
  const model = cfg.model || 'Example model A';
  const reasoning = cfg.reasoning ?? 'Medium';
  const fallback = cfg.fallback ?? 'Example model B';
  const fallbackReasoning = cfg.fallbackReasoning ?? 'Medium';
  return [
    '<div class="task-config-summary">',
    `<span><small>Model</small><b>${esc(model)}</b><em class="reasoning-level" title="Reasoning: ${esc(reasoning)}" aria-label="Reasoning: ${esc(reasoning)}">${esc(reasoning.slice(0, 1))}</em></span>`,
    `<span><small>Fallback</small><b>${esc(fallback)}</b>${fallback !== 'None' ? `<em class="reasoning-level" title="Fallback reasoning: ${esc(fallbackReasoning)}" aria-label="Fallback reasoning: ${esc(fallbackReasoning)}">${esc(fallbackReasoning.slice(0, 1))}</em>` : ''}</span>`,
    `<span><small>Mode</small><b>${esc(cfg.mode ?? 'Automatic')}</b></span>`,
    `<span><small>Retries</small><b>${esc(String(cfg.retries ?? 2))}</b></span>`,
    '</div>',
  ].join('');
}

function stepCard(n, execution, activeEdges) {
  const status = execution ? (state.runState[n.name] || sampleStatus(n)) : 'Planned';
  const attention = execution && attentionStatuses.includes(status);
  const kind = stepKind(n.name);
  const human = /Finalize delivery|Confirm constraints/.test(n.name);
  const colors = palette[kind];
  const title = stepTitle(n.name);
  const dod = stepDod(n.name);
  const outgoing = activeEdges.filter(([a]) => a.name === n.name).length;
  const attempts = status === 'Waiting' ? 0 : status === 'Needs review' ? 2 : 1;
  let actions = '';
  if (execution) {
    actions = `<div class="node-actions"><button data-run-action="stop" data-name="${esc(n.name)}" ${status !== 'In progress' ? 'disabled' : ''}>Stop</button><button data-run-action="accept" data-name="${esc(n.name)}" ${status !== 'Needs review' ? 'disabled' : ''}>Accept</button><button class="open-chat" data-chat="${esc(n.name)}">Open chat ↗</button></div>`;
  } else if (n.name !== 'Start') {
    actions = `<div class="node-actions planning-actions"><button data-edit-task="${esc(n.name)}">Edit</button><button data-prompt-task="${esc(n.name)}">Ask AI</button><button class="trash-button" data-delete-task="${esc(n.name)}" title="Delete step" aria-label="Delete ${esc(title)}">${trashIcon}</button></div>`;
  }
  return [
    `<div class="graph-node ${human ? 'human-gate' : ''} ${attention ? 'needs-attention' : ''}" data-status="${esc(status)}" role="button" tabindex="0" data-task="${esc(n.name)}" data-kind="Step" style="left:${n.x}px;top:${n.y}px;width:230px;height:${execution ? 320 : 310}px;background:${colors[0]};border-color:${colors[1]}">`,
    `<strong>${execution ? `<span class="node-dot" style="color:${statusColor(status)}">●</span> ` : ''}${esc(title)} ${human ? '<span title="Human gate" aria-label="Human gate">👤</span>' : ''}</strong>`,
    attention ? '<span class="attention-label">● Needs attention</span>' : '',
    `<span class="type-chip" title="${kind}${human ? ' · Human gate' : ''}" aria-label="${kind}${human ? ' · Human gate' : ''}">${initials[kind]}</span>`,
    execution ? `<div class="node-status">${status} · Attempts: ${attempts}</div>` : '',
    configSummary(n.name),
    `<div class="task-desc">${esc(stepDescription(n.name))}</div>`,
    !execution && outgoing > 1 ? `<div class="parallel-note">⑂ ${outgoing} parallel next steps</div>` : '',
    n.name === 'Build search UI' ? '<div class="node-return">↩ Failed check → Design search input</div>' : '',
    `<details class="node-extra"><summary>DoD<span class="dod-preview">${esc(dod)}</span></summary><div class="node-extra-body"><b>DoD:</b> ${esc(dod)}<br><span class="small muted">Select the card for full settings.</span></div></details>`,
    !execution ? `<button class="branch-button" data-show-branch="${esc(n.name)}" aria-label="Show branch from ${esc(title)}">⑂ Show branch</button>` : '',
    actions,
    '</div>',
  ].join('');
}

function graphMarkup(execution, activeEdges) {
  const paths = activeEdges.map(([a, b]) => {
    const x1 = a.x + 230, y1 = a.y + 95, x2 = b.x, y2 = b.y + 95;
    return `<path d="M ${x1} ${y1} C ${x1 + 70} ${y1}, ${x2 - 70} ${y2}, ${x2} ${y2}" fill="none" stroke="#53b988" stroke-width="2" marker-end="url(#arrow)"/>`;
  }).join('');
  const cards = nodes.filter(n => !state.deletedTasks.includes(n.name)).map(n => stepCard(n, execution, activeEdges)).join('');
  return [
    '<div class="graph-board" aria-label="Pipeline graph"><div class="graph-inner" style="width:1840px;height:2320px">',
    '<svg width="1840" height="2320" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53b988"/></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e4b65e"/></marker></defs>',
    paths,
    '<path d="M 1355 50 L 1355 25 L 1055 25 L 1055 50" fill="none" stroke="#e4b65e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#return-arrow)"/><text x="1070" y="20" fill="#e4b65e" font-size="11">Failed check → rework</text></svg>',
    cards,
    '<div style="position:absolute;left:40px;top:2260px;color:#a4b6ad;font-size:12px">Green: dependencies · Dashed amber: return for rework · Independent paths can run in parallel</div>',
    '</div></div>',
  ].join('');
}

function branchSet(activeEdges) {
  const names = new Set();
  if (state.branchRoot === 'all') return names;
  names.add(state.branchRoot);
  let changed = true;
  while (changed) {
    changed = false;
    for (const [a, b] of activeEdges) {
      if (names.has(a.name) && !names.has(b.name)) {
        names.add(b.name);
        changed = true;
      }
    }
  }
  return names;
}

function cardsMarkup(execution, graph, activeEdges) {
  const branchNames = branchSet(activeEdges);
  const container = document.createElement('div');
  container.innerHTML = graph;
  const cards = [...container.querySelectorAll('.graph-node')].filter(card => execution || state.branchRoot === 'all' || branchNames.has(card.dataset.task));
  const groups = execution
    ? [['Needs attention', attentionStatuses], ['In progress', ['In progress']], ['Waiting', ['Waiting']], ['Done', ['Done', 'Accepted']]]
    : [['Steps', ['Planned']]];
  const info = !execution && state.branchRoot !== 'all'
    ? `<p class="branch-info">Branch from <strong>${esc(stepTitle(state.branchRoot))}</strong> · ${cards.length} steps including parallel paths</p>`
    : '';
  const sections = groups.map(([title, statuses]) => {
    const matches = cards.filter(card => statuses.includes(card.dataset.status));
    return matches.length ? `<section class="task-list-group"><h2>${title} <span class="badge">${matches.length}</span></h2><div class="task-list-grid">${matches.map(card => card.outerHTML).join('')}</div></section>` : '';
  }).join('');
  return `${info}<div class="task-list">${sections}</div>`;
}

function sectionStrip() {
  return `<nav class="stage-strip section-strip" aria-label="Pipeline sections">${Object.entries(SECTIONS).map(([key, label]) => `<button class="stage-pill ${state.page === key ? 'current' : ''}" data-section="${key}" aria-current="${state.page === key ? 'page' : 'false'}">${label}</button>`).join('')}</nav>`;
}

function viewTools(execution) {
  const view = execution ? state.executionView : state.planningView;
  const branchFilter = !execution && state.planningView === 'cards'
    ? `<select class="button branch-filter" id="branch-filter" aria-label="Filter by branch"><option value="all">All branches</option>${nodes.filter(n => !state.deletedTasks.includes(n.name)).map(n => `<option value="${esc(n.name)}" ${state.branchRoot === n.name ? 'selected' : ''}>From: ${esc(stepTitle(n.name))}</option>`).join('')}</select>`
    : '';
  return `<div class="view-tools" role="group" aria-label="${execution ? 'Execution' : 'Planning'} view"><span class="view-label">${execution ? 'Execution' : 'Workflow'}</span>${branchFilter}<button class="button" data-workflow-view="diagram" aria-pressed="${view === 'diagram'}">Diagram</button><button class="button" data-workflow-view="cards" aria-pressed="${view === 'cards'}">List</button></div>`;
}

const legend = '<details class="legend-disclosure"><summary>Legend</summary><div class="legend-types" aria-label="Step type legend"><span><i style="background:#202c31;border-color:#496a78">R</i> Research</span><span><i style="background:#2b2534;border-color:#715d83">D</i> Design</span><span><i style="background:#202d2b;border-color:#4e7566">C</i> Coding</span><span><i style="background:#292b22;border-color:#777a4e">T</i> Testing</span><span><i style="background:#302a22;border-color:#897353">V</i> Review</span><span><i style="background:#30252a;border-color:#8b626e">A</i> Acceptance</span><span><i style="background:#202829;border-color:#52615d">S</i> Start</span><span><i class="gate-key">👤</i> Human gate · requires a person</span><span>Dashed amber arrow · return for rework</span></div></details>';

function flowRequestCard() {
  return `<div class="card flow-request"><h2>Change the workflow</h2><label class="small muted" for="flow-prompt">Describe the changes for the model</label><textarea id="flow-prompt" class="field" placeholder="For example: add a review after testing"></textarea><div class="row" style="flex-wrap:wrap"><button class="button" data-flow-request>Request change</button><button class="button" data-flow-chat>Open workflow chat ↗</button></div>${state.flowChat ? '<p class="small muted">Workflow chat is illustrated in this mock. No agent is connected.</p>' : ''}${state.flowRequests.map(x => `<p class="request-log">Draft request: ${esc(x)}</p>`).join('')}</div>`;
}

function chatPreview() {
  if (!state.mockChat) return '';
  return `<div class="chat-preview"><div class="row spread"><strong>Agent chat · ${esc(state.mockChat)}</strong><button class="button" data-close-chat>Close</button></div><p class="small muted">Chat navigation is illustrated in this mock. No agent is connected.</p></div>`;
}

function selectOptions(values, selected) {
  return values.map(value => `<option ${value === selected ? 'selected' : ''}>${value}</option>`).join('');
}

function editorDialog(editable) {
  const name = state.taskEditor;
  if (!name) return '';
  const cfg = stepConfig(name);
  const dodItems = stepDod(name).split('\n').filter(Boolean).map((item, i) => `<div class="dod-item"><span class="dod-box" aria-hidden="true">☐</span><input class="field dod-input" aria-label="DoD item ${i + 1}" value="${esc(item)}">${editable ? '<button type="button" class="button" data-remove-dod aria-label="Remove criterion">×</button>' : ''}</div>`).join('');
  return [
    `<div class="task-overlay"><div class="task-dialog task-editor" id="task-editor" role="dialog" aria-modal="true" aria-labelledby="edit-task-heading"><h2 id="edit-task-heading">${editable ? 'Edit step' : 'Step details'}</h2>`,
    !editable ? '<p class="small muted">Read-only · execution settings are locked.</p>' : '',
    `<fieldset class="task-fields" ${editable ? '' : 'disabled'}>`,
    `<label>Title<input class="field" id="edit-task-title" value="${esc(stepTitle(name))}"></label>`,
    `<label>Description<textarea class="field" id="edit-task-description">${esc(stepDescription(name))}</textarea></label>`,
    `<label>Definition of done</label><div class="dod-list" id="edit-dod-list">${dodItems}</div>`,
    editable ? '<button type="button" class="button dod-actions" data-add-dod>+ Add criterion</button>' : '',
    '<h2 style="margin-top:18px">Execution settings</h2>',
    `<label>Model<input class="field" data-edit-config="model" list="mock-models" value="${esc(cfg.model ?? 'Example model A')}" placeholder="Search provider or model" autocomplete="off"></label>`,
    `<label>Reasoning<select class="field" data-edit-config="reasoning">${selectOptions(['Low', 'Medium', 'High'], cfg.reasoning ?? 'Medium')}</select></label>`,
    `<label>Fallback model<input class="field" data-edit-config="fallback" list="mock-fallback-models" value="${esc(cfg.fallback ?? 'Example model B')}" placeholder="Search provider or model" autocomplete="off"></label>`,
    `<label>Fallback reasoning<select class="field" data-edit-config="fallbackReasoning">${selectOptions(['Low', 'Medium', 'High'], cfg.fallbackReasoning ?? 'Medium')}</select></label>`,
    `<label>Mode<select class="field" data-edit-config="mode">${selectOptions(['Automatic', 'Manual'], cfg.mode ?? 'Automatic')}</select></label>`,
    '<datalist id="mock-models"><option value="Example provider 1 / Example model A"><option value="Example provider 1 / Example model B"><option value="Example provider 2 / Example model C"><option value="Example model A"><option value="Example model B"></datalist>',
    '<datalist id="mock-fallback-models"><option value="None"><option value="Example provider 1 / Example model A"><option value="Example provider 1 / Example model B"><option value="Example provider 2 / Example model C"><option value="Example model A"><option value="Example model B"></datalist>',
    '<p class="model-help">Example catalog · provider and model names are illustrative.</p>',
    `<label>Retry limit<input class="field" data-edit-config="retries" type="number" min="0" max="10" value="${esc(String(cfg.retries ?? 2))}"></label>`,
    '</fieldset>',
    `<div class="row" style="margin-top:14px">${editable ? '<button class="button primary" data-save-task>Save</button>' : ''}<button class="button" data-cancel-task>${editable ? 'Cancel' : 'Close'}</button></div>`,
    '</div></div>',
  ].join('');
}

function promptDialog() {
  if (!state.taskPrompt) return '';
  return `<div class="task-overlay"><div class="task-dialog" id="task-prompt-panel" role="dialog" aria-modal="true" aria-labelledby="prompt-task-heading"><h2 id="prompt-task-heading">Change step · ${esc(stepTitle(state.taskPrompt))}</h2><textarea id="task-prompt" class="field" placeholder="Describe what the model should change"></textarea><div class="row"><button class="button" data-send-task-prompt>Request change</button><button class="button" data-cancel-task>Cancel</button></div></div></div>`;
}

function render() {
  const execution = state.page === 'execution';
  const editable = !execution;
  $('#heading').textContent = 'Sample pipeline';
  $('#context').textContent = `SAMPLE PROJECT / ${SECTIONS[state.page].toUpperCase()}`;
  document.title = `${SECTIONS[state.page]} · Pipeline · UI mock`;

  const activeEdges = edges.filter(([a, b]) => !state.deletedTasks.includes(a.name) && !state.deletedTasks.includes(b.name));
  if (state.deletedTasks.includes(state.branchRoot)) state.branchRoot = 'all';
  const graph = graphMarkup(execution, activeEdges);
  const view = execution ? state.executionView : state.planningView;
  const stepView = view === 'cards' ? cardsMarkup(execution, graph, activeEdges) : graph;
  const intro = execution
    ? '<p class="small muted">Demo run · sample statuses. Stop and Accept change only this page; no agents are running.</p>'
    : '<p class="small muted">Configure the process graph: steps, dependencies, executors and checks. Changes stay in this page.</p>';

  $('#body').innerHTML = [
    sectionStrip(),
    intro,
    viewTools(execution),
    execution ? chatPreview() : '',
    legend,
    editable ? flowRequestCard() : '',
    editorDialog(editable),
    promptDialog(),
    state.taskRequests.map(x => `<p class="request-log">Draft for ${esc(x.task)}: ${esc(x.text)}</p>`).join(''),
    stepView,
    '<p class="small muted">Within each step: To do → In progress → DoD review → Done · failed review returns to rework with feedback.</p>',
  ].join('');
}

function setPage(page) {
  if (!(page in SECTIONS)) return;
  state.page = page;
  state.taskEditor = null;
  state.taskPrompt = null;
  if (location.hash !== '#' + page) {
    try { history.replaceState(null, '', '#' + page); } catch { location.hash = page; }
  }
  render();
}

function openStep(name) {
  state.taskEditor = name;
  state.taskPrompt = null;
  render();
  document.querySelector('#edit-task-title:not(:disabled), #task-editor [data-cancel-task]')?.focus();
}

document.addEventListener('click', e => {
  const t = e.target;
  const section = t.closest('[data-section]');
  if (section) { setPage(section.dataset.section); return; }
  if (t.closest('[data-add-dod]')) {
    const item = document.createElement('div');
    item.className = 'dod-item';
    item.innerHTML = '<span class="dod-box" aria-hidden="true">☐</span><input class="field dod-input" aria-label="DoD criterion" placeholder="Add a criterion"><button type="button" class="button" data-remove-dod aria-label="Remove criterion">×</button>';
    document.getElementById('edit-dod-list').appendChild(item);
    item.querySelector('input').focus();
    return;
  }
  const removeDod = t.closest('[data-remove-dod]');
  if (removeDod) { removeDod.closest('.dod-item').remove(); return; }
  const view = t.closest('[data-workflow-view]');
  if (view) {
    if (state.page === 'execution') state.executionView = view.dataset.workflowView;
    else state.planningView = view.dataset.workflowView;
    render();
    return;
  }
  const edit = t.closest('[data-edit-task]'), prompt = t.closest('[data-prompt-task]'), del = t.closest('[data-delete-task]');
  if (edit || prompt || del) {
    if (state.page !== 'planning') return;
    if (edit) { openStep(edit.dataset.editTask); return; }
    if (prompt) {
      state.taskPrompt = prompt.dataset.promptTask;
      state.taskEditor = null;
    } else {
      state.deletedTasks.push(del.dataset.deleteTask);
      state.taskEditor = null;
      state.taskPrompt = null;
    }
    render();
    document.getElementById('task-prompt')?.focus();
    return;
  }
  if (t.closest('[data-save-task]')) {
    if (state.page !== 'planning' || !state.taskEditor) return;
    const titleField = document.getElementById('edit-task-title');
    const title = titleField.value.trim();
    if (!title) { titleField.focus(); return; }
    state.taskEdits[state.taskEditor] = {
      title,
      description: document.getElementById('edit-task-description').value,
      dod: [...document.querySelectorAll('#edit-dod-list .dod-input')].map(input => input.value.trim()).filter(Boolean).join('\n'),
    };
    const cfg = state.taskConfig[state.taskEditor] ??= {};
    document.querySelectorAll('[data-edit-config]').forEach(el => { cfg[el.dataset.editConfig] = el.value; });
    state.taskEditor = null;
    render();
    return;
  }
  const branch = t.closest('[data-show-branch]');
  if (branch) {
    state.branchRoot = branch.dataset.showBranch;
    state.planningView = 'cards';
    render();
    return;
  }
  if (t.closest('[data-cancel-task]')) { state.taskEditor = null; state.taskPrompt = null; render(); return; }
  if (t.closest('[data-flow-chat]')) { state.flowChat = !state.flowChat; render(); return; }
  if (t.closest('[data-flow-request]')) {
    const field = document.getElementById('flow-prompt');
    if (field.value.trim()) { state.flowRequests.push(field.value.trim()); render(); } else field.focus();
    return;
  }
  if (t.closest('[data-send-task-prompt]')) {
    const field = document.getElementById('task-prompt');
    if (field.value.trim()) { state.taskRequests.push({task: state.taskPrompt, text: field.value.trim()}); state.taskPrompt = null; render(); } else field.focus();
    return;
  }
  const chat = t.closest('[data-chat]');
  if (chat) { state.mockChat = chat.dataset.chat; render(); document.querySelector('.chat-preview')?.scrollIntoView({block: 'nearest'}); return; }
  if (t.closest('[data-close-chat]')) { state.mockChat = null; render(); return; }
  const run = t.closest('[data-run-action]');
  if (run) {
    if (!run.disabled && state.page === 'execution') {
      state.runState[run.dataset.name] = run.dataset.runAction === 'stop' ? 'Stopped' : 'Accepted';
      render();
    }
    return;
  }
  if (t.closest('details.node-extra')) return;
  const step = t.closest('[data-task]');
  if (step) openStep(step.dataset.task);
});

document.addEventListener('change', e => {
  if (e.target.id === 'branch-filter') { state.branchRoot = e.target.value; render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (state.taskEditor || state.taskPrompt)) { state.taskEditor = null; state.taskPrompt = null; render(); return; }
  if (e.target.closest('.task-dialog') || e.target.closest('details.node-extra')) return;
  const step = e.target.closest('[data-task]');
  if (step && e.target === step && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openStep(step.dataset.task); }
});

window.addEventListener('hashchange', () => { if (sectionFromHash() !== state.page) setPage(sectionFromHash()); });

render();
</script></body></html>
